[project]
name = "tasksense"
version = "0.1.0"
description = "Task management API with semantic search - FastAPI, SQLAlchemy, Alembic"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.161.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "S", "PT", "RUF", "ASYNC", "FAST", "C4", "DTZ", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the pytest way
".claude/hooks/**" = ["S603"]  # fixed argv to our own dev tools, no shell

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
